spring:
  application:
    name: ecommsample
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username:
    password:
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
  ai:
    mcp:
      server:
        name: ecommerce-tools        # Name this clearly — it appears in LLM context
        version: 1.0.0
        type: SYNC
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3
        options:
          temperature: 0.7
          max_tokens: 2048
  server:
    port: 8081
  logging:
    level:
      org.springframework.ai: INFO
